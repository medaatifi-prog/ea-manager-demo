<script>

workshop:{title:"الورشة",desc:"متابعة أعمال الإصلاح والصيانة.",cards:[["قيد الإصلاح",4],["جاهز",3]],rows:[["DEMO-101","تغيير الإضاءة","قيد الإصلاح"],["DEMO-102","فحص التغذية","جاهز"]]},

};
function render(key){
const p=pages[key]||pages.dashboard;
document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("active",b.dataset.page===key));
let html=`<h2>${p.title}</h2><p class="muted">${p.desc}</p>`;

}
